services:
  - type: web
    name: divine-bratan-archive
    runtime: node
    repo: https://github.com/TheRealSGPlugins/base44-project
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
